<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="hunt.title">Hallucination Hunt · DeepSeek Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234d6bfe'/%3E%3Cpath d='M7 18c2 4 8 6 12 3 3-2 3-5 6-7-2 0-3 1-4 0-1-4-6-6-9-4-3 1-6 5-5 8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/arcade.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card hunt-card">
    <p class="back-row"><a class="arcade-back" href="../../" data-i18n="ui.back">← 返回游戏厅</a></p>
    <header class="head">
      <h1 data-i18n="hunt.h1">🐳 HALLUCINATION HUNT</h1>
      <p class="sub" data-i18n="hunt.sub">读懂回答 · 找出幻觉 · 验证事实</p>
    </header>

    <div class="game-shell" id="game-shell" data-state="intro">
      <canvas id="game" class="layer-backdrop" aria-hidden="true"></canvas>

      <div class="hud" id="hud">
        <div class="hud-cell"><span class="hud-k" data-i18n="hunt.score">SCORE</span><b id="hud-score">0</b></div>
        <div class="hud-cell"><span class="hud-k" data-i18n="hunt.hi">HIGH SCORE</span><b id="hud-high">0</b></div>
        <div class="hud-cell"><span class="hud-k" data-i18n="hunt.accuracy">ACCURACY</span><b id="hud-accuracy">0%</b></div>
        <div class="hud-cell"><span class="hud-k" data-i18n="hunt.streak">STREAK</span><b id="hud-streak">×0</b></div>
        <div class="hud-cell"><span class="hud-k" data-i18n="hunt.load">LOAD</span><b id="hud-load">LOAD 1</b></div>
        <div class="hud-cell"><span class="hud-k" data-i18n="hunt.lives">LIVES</span><b id="hud-lives">3</b></div>
        <div class="hud-cell wide"><span class="hud-k" data-i18n="hunt.round">ROUND</span><b id="hud-round">#0</b></div>
      </div>

      <section class="query-panel">
        <p class="panel-k" data-i18n="hunt.query">QUERY</p>
        <p class="query-text" id="query-text"></p>
      </section>

      <section class="confidence" aria-hidden="true">
        <span class="panel-k" data-i18n="hunt.confidence">MODEL CONFIDENCE</span>
        <div class="conf-track"><div class="conf-fill" id="confidence-bar" style="width:0%"></div></div>
        <span class="conf-value" id="confidence-value">0%</span>
      </section>

      <section class="response-panel">
        <p class="panel-k" data-i18n="hunt.response">MODEL RESPONSE</p>
        <div class="response" id="response" role="group" aria-busy="true" data-i18n-aria="hunt.responseAria"></div>
      </section>

      <section class="action-panel" id="action-panel" data-enabled="false">
        <button id="btn-none" class="btn" type="button" data-i18n="hunt.noHallucination">NO HALLUCINATION</button>
        <button id="btn-verify" class="btn primary" type="button" data-i18n="hunt.verify">VERIFY</button>
        <button id="btn-start" class="btn primary" type="button" data-i18n="hunt.startBtn">开始审查</button>
        <button id="btn-daily" class="btn" type="button" data-i18n="hunt.dailyBtn">DAILY HUNT</button>
        <button id="btn-again" class="btn" type="button" data-i18n="hunt.againBtn">再玩一次</button>
        <button id="btn-copy" class="btn" type="button" data-i18n="hunt.copyBtn">COPY RESULT</button>
      </section>

      <div class="timer-track"><div class="timer-fill" id="scan-bar" style="width:100%"></div></div>

      <div class="controls">
        <button id="btn-pause" class="btn ghost" type="button" data-i18n="hunt.pauseBtn">⏸ 暂停</button>
        <button id="lang" class="btn ghost" type="button"
                title="切换语言 / Switch language" aria-label="切换语言 / Switch language">🌐 English</button>
        <button id="sound" class="btn ghost" type="button" aria-pressed="true">🔊 音效</button>
      </div>

      <div class="verifier-stage" id="verifier-stage" aria-hidden="true"></div>

      <div class="overlay" id="overlay" data-show="false">
        <h2 class="ov-title" id="overlay-title"></h2>
        <div class="ov-body" id="overlay-body"></div>
      </div>

      <canvas id="fx" class="layer-fx" aria-hidden="true"></canvas>
    </div>

    <p class="sr-status" id="status" role="status" aria-live="polite"></p>
    <textarea id="share-out" class="share-out" readonly aria-label="Result text" tabindex="-1"></textarea>

    <footer class="tips" data-i18n-html="hunt.tips">
      模型会生成一段回答，其中可能藏着一条或多条 <b>HALLUCINATION</b>，也可能完全正确。
      点出你认为错误的那一条，或者选择 <b>NO HALLUCINATION</b>。<b>MODEL CONFIDENCE</b> 只是气氛，高置信度也可能是错的。
    </footer>
  </main>

  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="../../shared/whale.js"></script>
  <script src="../../shared/character.js"></script>
  <script src="rng.js"></script>
  <script src="content.js"></script>
  <script src="mutators.js"></script>
  <script src="generator.js"></script>
  <script src="difficulty.js"></script>
  <script src="effects.js"></script>
  <script src="renderer.js"></script>
  <script src="game.js"></script>
</body>
</html>
