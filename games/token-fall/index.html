<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="tokenfall.title">TOKEN FALL · DeepSeek Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234d6bfe'/%3E%3Cpath d='M7 18c2 4 8 6 12 3 3-2 3-5 6-7-2 0-3 1-4 0-1-4-6-6-9-4-3 1-6 5-5 8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/arcade.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="back-row"><a class="arcade-back" href="../../" data-i18n="ui.back">← 返回游戏厅</a></p>
    <header class="head">
      <h1 data-i18n="tokenfall.h1">🐳 TOKEN FALL</h1>
      <p class="sub" data-i18n="tokenfall.sub">← → / A D 移动　·　接 TOKEN 与 COMPRESS，躲开 NOISE　·　P 暂停</p>
    </header>

    <div class="stage">
      <canvas id="game" aria-label="TOKEN FALL 游戏画面" data-i18n-aria="tokenfall.aria"></canvas>
    </div>

    <div class="pad">
      <button id="left" class="btn" type="button" aria-label="向左" data-i18n-aria="tokenfall.ariaLeft">←</button>
      <button id="right" class="btn" type="button" aria-label="向右" data-i18n-aria="tokenfall.ariaRight">→</button>
    </div>

    <div class="controls">
      <button id="pause" class="btn" type="button" aria-pressed="false">⏸ 暂停</button>
      <button id="lang" class="btn ghost" type="button"
              title="切换语言 / Switch language" aria-label="切换语言 / Switch language">🌐 English</button>
      <button id="sound" class="btn ghost" type="button" aria-pressed="true">🔊 音效</button>
    </div>

    <footer class="tips" data-i18n-html="tokenfall.tips">
      屏幕顶部落下 <b>TOKEN</b>（蓝）/ <b>COMPRESS</b>（青）/ <b>NOISE</b>（紫）/ <b>THINK</b>（金）。
      接 TOKEN 得分但 <b>CONTEXT +32</b>；接 COMPRESS 压缩 <b>CONTEXT −256</b>；
      NOISE 会让 <b>CONTEXT +128</b> 且不加分，必须躲开。CONTEXT 满 1024 后还有 <b>2 秒抢救时间</b>，
      吃到 COMPRESS 就能取消溢出。最高分存在本地浏览器里。
    </footer>
  </main>

  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
