name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 首次运行自动启用 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 打包静态文件（仓库根目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        name: 发布
        uses: actions/deploy-pages@v4
