name: Test & Deploy to GitHub Pages

# 流程：checkout -> setup Node -> 跑全部逻辑测试 -> 真实 Chrome 冒烟 -> 通过后才配置/上传/部署 Pages。
# 任何一环失败，后面的 job 都不会开始（needs 链），线上就保持上一版。
#
# 为什么冒烟要独立一个 job：test/run.mjs 的 1800+ 条断言全跑在自制 DOM 桩上，
#   「真实浏览器里事件冒泡到谁」「CSS 解析器有没有丢掉整条规则」这类事实它证明不了。
#   browser-smoke 只补那一层（约 46 条），不重复已有逻辑，也不引任何 npm 依赖。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node test/run.mjs

  browser-smoke:
    name: Real Chrome smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 逻辑测试固定在 Node 20（那是兼容目标）；这一层单独用 Node 22，
      # 因为直连 CDP 需要内置的全局 WebSocket（Node 21+，22 起稳定）。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 确认有真实浏览器（不假定固定路径，并且真的能起无头）
        run: |
          find_browser() {
            for b in google-chrome google-chrome-stable chromium chromium-browser; do
              if command -v "$b" >/dev/null 2>&1; then command -v "$b"; return 0; fi
            done
            return 1
          }
          BIN="$(find_browser || true)"
          if [ -z "$BIN" ]; then
            echo "runner 上没有现成浏览器，尝试装 chromium"
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser || true
            BIN="$(find_browser || true)"
          fi
          if [ -z "$BIN" ]; then
            echo "::error::找不到任何 Chrome / Chromium，真实浏览器冒烟无法运行"
            exit 1
          fi
          echo "browser: $BIN"
          "$BIN" --version || true
          # 有些发行版的 chromium 只是 snap 壳子，command -v 找得到但根本起不来。
          # 这里真的起一次无头 Chrome，起不来就直接给出 annotation，而不是让冒烟
          # 在后面报一个看不懂的「CDP 端点连不上」。
          if ! timeout 60 "$BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage                  --user-data-dir="$(mktemp -d)" --dump-dom about:blank >/dev/null 2>&1; then
            echo "::error::$BIN 无法启动无头模式（可能是 snap 壳子 / 缺沙箱权限）"
            timeout 60 "$BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom about:blank 2>&1 | tail -20 || true
            exit 1
          fi
          echo "headless 启动检查通过"
          echo "CHROME_BIN=$(readlink -f "$BIN")" >> "$GITHUB_ENV"
      - name: Run browser smoke
        env:
          REQUIRE_BROWSER: '1'
        run: |
          node --version
          node test/browser-smoke.mjs
      - name: 冒烟失败时保留截图与诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: browser-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Pages
    needs: browser-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 首次运行自动启用 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 打包静态文件（仓库根目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        name: 发布
        uses: actions/deploy-pages@v4
