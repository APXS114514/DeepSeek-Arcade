name: Test & Deploy to GitHub Pages

# 流程：checkout -> setup Node -> 跑全部测试 -> 通过后才配置/上传/部署 Pages。
# 测试不过，deploy job 不会开始（needs: test），线上就保持上一版。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node test/run.mjs
      - name: Report failures
        if: failure()
        run: |
          node test/run.mjs > /tmp/arcade-tests.txt 2>&1 || true
          grep -E "^FAIL|项失败" /tmp/arcade-tests.txt | head -25 | while IFS= read -r line; do
            echo "::error::$line"
          done

  deploy:
    name: Deploy Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 首次运行自动启用 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 打包静态文件（仓库根目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        name: 发布
        uses: actions/deploy-pages@v4
